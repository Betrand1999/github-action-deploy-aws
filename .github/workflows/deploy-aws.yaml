name: Deploy My Docker Image to AWS EKS

on: 
  push:
    branches: 
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Ensure this matches your EKS cluster region

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'  # Install the latest version of kubectl

      - name: Set up kubeconfig for EKS
        run: |
          aws eks --region us-east-1 update-kubeconfig --name my-eks  # Set up kubeconfig for EKS
          
          # Verify current context to ensure correct cluster
          kubectl config current-context
          
          # Test connectivity with the cluster
          kubectl get nodes

      - name: Deploy to EKS
        run: |
          # Apply Kubernetes configurations
          kubectl apply -f ./kubernetes/namespace.yaml --validate=false  # Temporarily disabling validation if issues persist
          kubectl apply -f ./kubernetes/deployment.yaml
          kubectl apply -f ./kubernetes/service.yaml  # Corrected file path
