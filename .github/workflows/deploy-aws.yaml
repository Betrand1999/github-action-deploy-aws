name: Deploy My Docker Image to AWS EKS

on: 
  push:
    branches: 
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Set up kubeconfig for EKS
        run: |
          aws eks --region us-east-1 update-kubeconfig --name my-eks
          
          # Verify current context to ensure correct cluster
          kubectl config current-context
          
          # Test connectivity with the cluster
          kubectl get nodes
          
      - name: Generate EKS Token and Export KUBECONFIG
        run: |
          export KUBECONFIG=/home/runner/.kube/config
          aws eks get-token --cluster-name my-eks | jq -r '.status.token' > /tmp/kube_token
          export KUBERNETES_SERVICE_ACCOUNT_TOKEN=$(cat /tmp/kube_token)

      - name: Deploy to EKS
        run: |
          # Apply Kubernetes configurations
          kubectl apply -f ./kubernetes/namespace.yaml --validate=false
          kubectl apply -f ./kubernetes/deployment.yaml
          kubectl apply -f ./kubernetes/service.yaml
