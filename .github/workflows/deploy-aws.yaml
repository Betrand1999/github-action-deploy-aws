name: Deploy My Docker Image to AWS EKS

on: 
  push:
    branches: 
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'  

      - name: Set up kubeconfig for EKS
        run: |
          aws eks --region us-east-1 update-kubeconfig --name my-eks 

      - name: Deploy to EKS
        run: |
          kubectl apply -f ./kubernetes/namespace.yaml --validate=false  # Temporarily disabling validation if issues persist
          kubectl apply -f ./kubernetes/deployment.yaml
          kubectl apply -f ./kubernetes/service.yaml  # Corrected file path
