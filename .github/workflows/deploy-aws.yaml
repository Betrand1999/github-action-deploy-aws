name: Deploy My Docker Image to AWS EKS

on: 
  push:
    branches: 
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2  # Ensure this matches your EKS cluster region

      - name: Install kubectl
        uses: aws-actions/install-kubectl@v2
        with:
          version: 'latest'  # Specify version or use 'latest'

      - name: Login to Amazon EKS
        id: eks-login
        run: |
          aws eks update-kubeconfig --name my-eks-cluster --region us-west-2
          kubectl get pods
          
      - name: Deploy to EKS
        run: |
         kubectl create -f ./kubernetes/namespace.yaml
         kubectl create -f ./kubernetes/deployment.yaml
         kubectl create -f ./kubernetes/service.yaml.yaml
         
